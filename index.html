<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Persian Gulf — BountyWarz Twin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    html,body{margin:0;height:100%;background:#07080c;color:#ece8dc;font-family:Inter,system-ui,sans-serif;overflow:hidden}
    canvas#game-canvas{position:fixed;inset:0;z-index:0;touch-action:none}
    .bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:linear-gradient(180deg,rgba(7,8,12,.94),rgba(7,8,12,0));pointer-events:none}
    .bar b{font-size:14px;letter-spacing:.06em;font-weight:700}
    .bar .meta{font-size:12px;opacity:.85;font-family:"IBM Plex Mono",monospace}
    #hud-target{position:fixed;top:52px;left:14px;z-index:50;min-width:220px;max-width:min(320px,72vw);padding:12px 14px;background:rgba(8,10,16,.78);border:1px solid rgba(62,199,214,.35);border-radius:12px;backdrop-filter:blur(8px)}
    #tg-name{font-size:14px;font-weight:700;color:#d9f6fa}
    #tg-site{font-size:12px;color:#c9c3b4;margin-top:4px;line-height:1.35}
    #tg-range{display:inline-block;margin-top:8px;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.08em;color:#9aa;border:1px solid #334;border-radius:999px;padding:4px 8px}
    #tg-range.ok{color:#062;background:#7dffb3;border-color:#7dffb3}
    #hud-eval.eval{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:55;display:none;padding:8px 14px;border-radius:999px;font-size:13px;background:#10141c;border:1px solid #2a3344}
    #hud-eval.ok{display:block;color:#7dffb3;border-color:#2a6}
    #hud-eval.miss{display:block;color:#f2c14e;border-color:#765}
    #sites{position:fixed;top:58px;right:14px;z-index:50;width:min(260px,42vw);max-height:calc(100vh - 168px);overflow:auto;display:flex;flex-direction:column;gap:6px}
    #sites button{appearance:none;border:0;border-left:3px solid #3ec7d6;background:rgba(8,10,16,.78);color:#d9f6fa;text-align:left;padding:10px 12px;min-height:48px;font:13px Inter,sans-serif;cursor:pointer;border-radius:0 10px 10px 0}
    #sites button b{display:block;font-size:13px}
    #sites button span{display:block;margin-top:3px;font-size:11px;color:#9bb;font-weight:400}
    #sites button:hover,#sites button.on{background:rgba(20,40,48,.92);border-left-color:#e2c36b}
    #sites button.done{opacity:.72;border-left-color:#7dffb3}
    #thumb{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
    #thumb button{min-width:48px;min-height:48px;padding:0 14px;border:1px solid #2a3344;border-radius:12px;background:rgba(10,14,20,.88);color:#ece8dc;font:600 13px Inter,sans-serif;cursor:pointer}
    #thumb button.on{border-color:#3ec7d6;color:#d9f6fa}
    #hint{display:none}
    #gulf-quiz{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;width:min(460px,92vw);background:#10141c;border:1px solid #2a3344;border-radius:14px;padding:20px 20px 16px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
    #gulf-quiz .gq-kicker{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.12em;color:#3ec7d6;margin-bottom:6px}
    #gulf-quiz .gq-h{font-size:16px;font-weight:700;margin:0 28px 6px 0}
    #gulf-quiz .gq-p{font-size:14px;line-height:1.45;color:#d7d2c6;margin:0 0 14px}
    #gulf-quiz .gq-c{display:block;width:100%;margin:0 0 8px;text-align:left;background:#1a212c;border:1px solid #2e3848;color:#ece8dc;padding:12px;min-height:48px;border-radius:8px;cursor:pointer;font:13px Inter,sans-serif}
    #gulf-quiz .gq-c:hover{border-color:#3ec7d6}
    #gulf-quiz .gq-c.ok{border-color:#7dffb3;color:#7dffb3}
    #gulf-quiz .gq-c.miss{border-color:#f2c14e}
    #quiz-x{position:absolute;top:10px;right:12px;background:none;border:0;color:#9aa;font-size:22px;cursor:pointer;width:40px;height:40px}
    #gulf-log,#gulf-pins{display:none}
    @media (max-width:720px){
      #sites{top:auto;bottom:72px;right:10px;left:auto;width:min(210px,46vw);max-height:36vh}
      #hud-target{max-width:58vw}
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div class="bar">
    <b>PERSIAN GULF</b>
    <span class="meta">Solved <span id="gulf-solved">0</span>/<span id="gulf-total">0</span> · <span id="hud-fps">—</span> fps · <span id="hud-engine">BOOT</span> · <span id="hud-role">RED</span></span>
  </div>
  <div id="hud-target">
    <div id="tg-name">Acquiring theater…</div>
    <div id="tg-site">WASD fly · H classify · click a ring</div>
    <span id="tg-range" class="range">—</span>
  </div>
  <div id="hud-eval" class="eval"></div>
  <div id="sites" aria-label="Command map"></div>
  <div id="hint">Click a ring or a site. H = nearest. 1/2/3 = red/blue/purple.</div>
  <div id="thumb">
    <button type="button" id="btn-fly">Fly nearest</button>
    <button type="button" id="btn-classify">Classify (H)</button>
    <button type="button" data-role="red_quiz" class="on">1 RED</button>
    <button type="button" data-role="blue_quiz">2 BLUE</button>
    <button type="button" data-role="purple_quiz">3 PURPLE</button>
  </div>
  <div id="gulf-quiz"></div>
  <div id="gulf-pins" hidden></div>
  <pre id="gulf-log"></pre>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="js/engine-pick.js"></script>
  <script src="js/gulf-ctf-overlay.js"></script>
  <script src="js/gulf-raycaster.js"></script>
  <script src="js/world-boot.js"></script>
  <script src="js/gulf-hud.js"></script>
</body>
</html>
