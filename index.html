<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Persian Gulf — BountyWarz Theater</title>
  <style>
    html,body{margin:0;height:100%;background:#07080c;color:#ece8dc;font-family:Inter,system-ui,sans-serif;overflow:hidden}
    canvas#game-canvas{position:fixed;inset:0;z-index:0;touch-action:none}
    .bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,rgba(7,8,12,.94),transparent);pointer-events:none}
    .bar b{font-size:14px;letter-spacing:.06em}
    .bar .meta{font-size:12px;font-family:ui-monospace,monospace;opacity:.85}
    #hud-target{position:fixed;top:52px;left:14px;z-index:50;min-width:220px;padding:12px 14px;background:rgba(8,10,16,.78);border:1px solid rgba(62,199,214,.35);border-radius:12px}
    #tg-name{font-size:14px;font-weight:700;color:#d9f6fa}
    #tg-site{font-size:12px;color:#c9c3b4;margin-top:4px}
    #tg-range{display:inline-block;margin-top:8px;font:600 11px ui-monospace,monospace;color:#9aa;border:1px solid #334;border-radius:999px;padding:4px 8px}
    #tg-range.ok{color:#062;background:#7dffb3;border-color:#7dffb3}
    #hud-eval.eval{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:55;display:none;padding:8px 14px;border-radius:999px;font-size:13px;background:#10141c;border:1px solid #2a3344}
    #hud-eval.ok{display:block;color:#7dffb3}
    #hud-eval.miss{display:block;color:#f2c14e}
    #hud-combat,#hud-ops{position:fixed;z-index:50;font:600 11px ui-monospace,monospace;color:#c9e8ee;background:rgba(8,10,16,.75);border:1px solid #243040;border-radius:8px;padding:6px 10px}
    #hud-combat{left:14px;bottom:72px}
    #hud-ops{left:50%;transform:translateX(-50%);bottom:72px;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #sites{position:fixed;top:58px;right:14px;z-index:50;width:min(260px,42vw);max-height:calc(100vh - 168px);overflow:auto;display:flex;flex-direction:column;gap:6px}
    #sites button{appearance:none;border:0;border-left:3px solid #3ec7d6;background:rgba(8,10,16,.78);color:#d9f6fa;text-align:left;padding:10px 12px;min-height:48px;font:13px Inter,sans-serif;cursor:pointer}
    #thumb{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    #thumb button{min-width:48px;min-height:48px;padding:0 14px;border:1px solid #2a3344;border-radius:12px;background:rgba(10,14,20,.88);color:#ece8dc;font:600 13px Inter,sans-serif;cursor:pointer}
    #thumb button.on{border-color:#3ec7d6}
    #gulf-quiz,#gulf-log,#gulf-pins,#hint{display:none}
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div class="bar"><b>PERSIAN GULF</b><span class="meta">Solved <span id="gulf-solved">0</span>/<span id="gulf-total">0</span> · <span id="hud-fps">—</span> fps · <span id="hud-engine">BOOT</span> · <span id="hud-role">RED</span></span></div>
  <div id="hud-target"><div id="tg-name">Acquiring theater…</div><div id="tg-site">WASD fly · K intercept · L escort</div><span id="tg-range" class="range">—</span></div>
  <div id="hud-eval" class="eval"></div>
  <div id="hud-combat">K intercept · L escort · click fire</div>
  <div id="hud-ops">SYNTH KIT LIVE</div>
  <div id="sites" aria-label="Command map"></div>
  <div id="thumb">
    <button type="button" id="btn-fly" aria-label="Fly to nearest pin">Fly nearest</button>
    <button type="button" id="btn-classify" aria-label="Classify nearest pin">Classify (H)</button>
    <button type="button" data-role="red_quiz" class="on" aria-label="Red classify role">1 RED</button>
    <button type="button" data-role="blue_quiz" aria-label="Blue defend role">2 BLUE</button>
    <button type="button" data-role="purple_quiz" aria-label="Purple score role">3 PURPLE</button>
  </div>
  <div id="gulf-quiz"></div><div id="gulf-pins" hidden></div><pre id="gulf-log"></pre>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="js/engine-pick.js"></script>
  <script src="js/gulf-sites.js"></script>
  <script src="js/gulf-ui-state.js"></script>
  <script src="js/gulf-hud-theme.js"></script>
  <script src="js/gulf-combat-lite.js"></script>
  <script src="js/gulf-ctf-overlay.js"></script>
  <script src="js/gulf-raycaster.js"></script>
  <script src="js/world-boot.js"></script>
  <script src="js/gulf-hud.js"></script>
  <script src="js/gulf-engine-bridge.js"></script>
</body>
</html>
