<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>RANGE RELAY — Host show</title><style>body{margin:0;background:#07060c;color:#f3ead6;font-family:Inter,system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid #2a2414}.brand{color:#e2c36b;letter-spacing:.14em;font-weight:800}#clock{font:700 28px ui-monospace,monospace;color:#e2c36b}.ref{border:1px solid #3ec7d6;color:#3ec7d6;padding:4px 10px;border-radius:99px}main{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;max-width:1100px;margin:16px auto;padding:0 16px}.card{background:#10141c;border:1px solid #2a2414;border-radius:14px;padding:16px}h2{margin:0 0 8px;color:#e2c36b;font-size:16px}button,select{margin:4px 4px 0 0;padding:8px 12px;border-radius:8px;border:0;background:#e2c36b;color:#1a1408;font-weight:700;cursor:pointer}button.ghost{background:#1a212c;color:#f3ead6}button.bad{background:#ff6b6b}a{color:#3ec7d6}#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#e2c36b;color:#1a1408;padding:8px 14px;border-radius:99px;font-weight:800;opacity:0}#toast.on{opacity:1}</style></head><body><div id="toast"></div><header><div class="brand">RANGE RELAY SHOW</div><div id="clock">90:00</div><div class="ref">HOST / REF LIVE</div></header><main><section class="card"><h2>1. Host reads — then sortie</h2><p id="script">Pick a cell. Read it. Bell = last word.</p><select id="pick"></select><button type="button" id="read">Load clue</button><button type="button" id="sortie" class="ghost">SORTIE — London</button><ol><li>Offset. Look. Do not linger.</li><li>Five words. ARRIVED.</li><li>Token on league page.</li></ol><p><a href="league.html">Tote</a> · <a href="https://bountywarz.com/worlds/drone-london-recon/">London</a></p></section><section class="card"><h2>3. Strip</h2><table id="tbl"></table><p>Team <select id="who"><option>1</option><option>2</option><option>3</option><option>4</option></select> <button id="clean" type="button">CLEAN</button> <button id="dirty" class="bad" type="button">DIRTY</button></p></section></main><script>const $=id=>document.getElementById(id);function bell(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();[0,.12].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=i?660:880;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.35);o.stop(c.currentTime+t+.4)})}catch(e){}}const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)};const pts=[0,0,0,0];function draw(){$('tbl').innerHTML='<tr><th>TEAM</th><th>PTS</th></tr>'+pts.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+p+'</td></tr>').join('')}draw();fetch('data/league-public.json').then(r=>r.json()).then(j=>{const s=$('pick');j.categories.forEach(c=>c.cells.forEach(cell=>{const o=document.createElement('option');o.value=JSON.stringify({t:cell.title,p:cell.prompt,pts:cell.points});o.textContent=c.name+' '+cell.points+' — '+cell.title;s.appendChild(o)}))});$('read').onclick=()=>{const x=JSON.parse($('pick').value);$('script').textContent='HOST: '+x.t+' ('+x.pts+'). '+x.p+' — SORTIE when I stop.';bell();toast('CLUE LIVE')};$('sortie').onclick=()=>{toast('SORTIE');window.open('https://bountywarz.com/worlds/drone-london-recon/','_blank')};$('clean').onclick=()=>{const i=+$('who').value-1;pts[i]+=100;draw();bell();toast('CLEAN')};$('dirty').onclick=()=>toast('DIRTY');let left=90*60;setInterval(()=>{if(left<=0){$('clock').textContent='STOP';return}left--;$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')},1000)</script></body></html>
