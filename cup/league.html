<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Athelgard Range League — Pilot + Robot</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet"/><style>html,body{margin:0;background:#07060c;color:#f3ead6;font-family:Inter,system-ui,sans-serif}header{padding:18px 22px;display:flex;justify-content:space-between;border-bottom:1px solid #2a2414}.brand{font-family:Cinzel,serif;color:#e2c36b;letter-spacing:.12em;margin:0}.sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9aa}.hud{font-family:JetBrains Mono,monospace;color:#e2c36b}#scope,#modal{position:fixed;inset:0;background:rgba(4,5,10,.86);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}#modal{display:none}.panel{width:min(560px,94vw);background:#10141c;border:1px solid #e2c36b;border-radius:16px;padding:24px}#board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:1100px;margin:18px auto;padding:0 16px}.cat{text-align:center;font-family:Cinzel,serif;font-size:12px;color:#e2c36b}.cell{border:1px solid #3a2f16;background:#14110c;color:#e2c36b;border-radius:12px;padding:26px 8px;font-weight:800;font-size:24px;cursor:pointer}.cell.dead{opacity:.35}input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid #3a2f16;background:#0b0d12;color:#f3ead6;font:14px JetBrains Mono,monospace}button{margin-top:8px;width:100%;padding:10px;border:0;border-radius:8px;background:#e2c36b;color:#1a1408;font-weight:800;cursor:pointer}.ghost{background:#1a212c;color:#f3ead6}#bank{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}#bank b{font:11px JetBrains Mono,monospace;background:#1a212c;padding:4px 6px;border-radius:6px;cursor:pointer}a{color:#3ec7d6}#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#e2c36b;color:#1a1408;padding:8px 14px;border-radius:99px;font-weight:800;opacity:0}#toast.on{opacity:1}</style></head><body><div id="toast"></div><div id="scope"><div class="panel"><div class="sub" style="color:#e2c36b">AGENTS ALLOWED</div><h2>Pilot + Robot</h2><p>No human-only rule. Pilot points the camera. Robot submits the token. Winner = points at 90:00.</p><button id="go" type="button">Start the league clock</button></div></div><header><div><p class="brand">RANGE LEAGUE</p><p class="sub">Pilot + robot · eggs + tokens</p></div><div class="hud">PTS <span id="score">0</span> · HIT <span id="hit">0</span> · MISS <span id="miss">0</span> · <span id="clock">90:00</span></div></header><p style="max-width:1100px;margin:10px auto;padding:0 16px;color:#bbb">Fly the egg in <a href="https://bountywarz.com/worlds/drone-london-recon/">London</a> or call from the prompt. Token must match.</p><div id="board"></div><div id="modal"><div class="panel" id="card"></div></div><script>const $=id=>document.getElementById(id);let data=null,armed=false,left=90*60,dead=new Set();const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)};async function sha(s){const b=new TextEncoder().encode(s.trim().toLowerCase());const buf=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}fetch('data/league-public.json').then(r=>r.json()).then(j=>{data=j;const el=$('board');j.categories.forEach(c=>{const h=document.createElement('div');h.className='cat';h.textContent=c.name;el.appendChild(h)});for(let row=0;row<4;row++)j.categories.forEach(c=>{const cell=c.cells[row],b=document.createElement('button');b.className='cell';b.textContent=cell.points;b.onclick=()=>openCell(cell,b,c);el.appendChild(b)})});$('go').onclick=()=>{armed=true;$('scope').style.display='none';toast('CLOCK LIVE — AGENTS ALLOWED')};function openCell(cell,btn,cat){if(!armed||dead.has(cell.id)||left<=0)return;const card=$('card');card.innerHTML='<div class="sub" style="color:#e2c36b">'+cat.name+' · '+cell.points+'</div><h2>'+cell.title+'</h2><p>'+cell.prompt+'</p><p style="color:#888">Token · '+cell.token_len+' chars</p><div id="bank"></div><input id="tok" type="text" placeholder="token_slug" autocomplete="off"/><button type="button" id="sub">Submit robot call</button><button type="button" class="ghost" id="cl">Close</button>';data.bank.forEach(w=>{const x=document.createElement('b');x.textContent=w;x.onclick=()=>{$('tok').value=w};$('bank').appendChild(x)});$('cl').onclick=()=>{$('modal').style.display='none'};$('sub').onclick=async()=>{const h=await sha($('tok').value);if(h===cell.hash){dead.add(cell.id);btn.classList.add('dead');$('score').textContent=+($('score').textContent)+cell.points;$('hit').textContent=+($('hit').textContent)+1;toast('+'+cell.points);$('modal').style.display='none'}else{$('miss').textContent=+($('miss').textContent)+1;toast('WRONG TOKEN')}};$('modal').style.display='flex';$('tok').focus()}setInterval(()=>{if(!armed)return;if(left<=0){$('clock').textContent='STOP';return}left--;$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')},1000)</script></body></html>
