<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Athelgard Range Cup</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet"/><style>:root{--gold:#e2c36b;--cyan:#3ec7d6;--miss:#ff6b6b;--ink:#f3ead6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(1200px 600px at 50% -10%,#1a1630 0%,transparent 55%),#07060c;color:var(--ink);font-family:Inter,system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 22px 8px}.brand{font-family:Cinzel,serif;font-size:22px;letter-spacing:.12em;color:var(--gold);margin:0}.sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9aa;margin:4px 0 0}.hud{display:flex;gap:16px;font-family:JetBrains Mono,monospace;font-size:13px}.hud b,#clock{color:var(--gold);font-size:20px}#clock.low{color:var(--miss)}#board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:1180px;margin:18px auto;padding:0 16px}.cat{text-align:center;font-family:Cinzel,serif;font-size:12px;color:var(--gold)}.cell{border:1px solid #3a2f16;background:linear-gradient(180deg,#1c1810,#12100c);color:var(--gold);border-radius:12px;padding:28px 8px;font:800 26px Inter,sans-serif;cursor:pointer}.cell:hover{box-shadow:0 0 24px rgba(226,195,107,.25)}.cell.dead{filter:grayscale(.7) brightness(.45)}#modal,#scope{display:none;position:fixed;inset:0;background:rgba(3,4,8,.8);z-index:20;align-items:center;justify-content:center;padding:16px}#scope{display:flex;z-index:50}#card,.panel{width:min(520px,94vw);background:#10141c;border:1px solid var(--gold);border-radius:16px;padding:24px}.gq-c{display:block;width:100%;margin:0 0 8px;text-align:left;background:#1a212c;border:1px solid #2e3848;color:var(--ink);padding:12px;border-radius:10px;cursor:pointer}.gq-c.yes{border-color:var(--gold);color:var(--gold)}.gq-c.no{border-color:var(--miss)}#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#e2c36b;color:#1a1408;padding:8px 16px;border-radius:99px;font-weight:800;opacity:0;z-index:40}#toast.on{opacity:1}.bar{height:4px;background:#1a1a22;margin:8px 22px 0}#fuel{height:100%;background:linear-gradient(90deg,#e2c36b,#3ec7d6);transform-origin:left}a{color:var(--cyan)}</style></head><body><div id="scope"><div class="panel"><div style="letter-spacing:.18em;color:#e2c36b;font-size:11px">AUTHORIZED RANGE</div><h2>This is a sandbox.</h2><p>Twins only. Classify. No live hulls. Fire does not score. Cards are sim evidence.</p><button class="gq-c" id="scope-go" style="background:#e2c36b;color:#1a1408;font-weight:800;text-align:center;border:0">I understand — start the clock</button></div></div><div id="toast"></div><header><div><p class="brand">ATHELGARD RANGE CUP</p><p class="sub">Classify the twin · keep the card · stop at 90</p></div><div class="hud"><span>SCORE <b id="score">0</b></span><span>STREAK <b id="streak">0</b></span><span>MISS <b id="miss">0</b></span><span id="clock">90:00</span></div></header><div class="bar"><div id="fuel"></div></div><p style="max-width:1180px;margin:8px auto;padding:0 16px" class="lede">Hit pops. Miss teaches. <a href="https://bountywarz.com/worlds/drone-london-recon/">Fly London</a>.</p><div id="board"></div><div id="modal"><div id="card"></div></div><script>const $=id=>document.getElementById(id);let armed=false,left=90*60,dead=new Set(),streak=0,TOTAL=90*60;function beep(ok){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?880:180;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.18);o.stop(c.currentTime+.2)}catch(e){}}function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1500)}$('scope-go').onclick=()=>{armed=true;$('scope').style.display='none';toast('CLOCK LIVE')};fetch('data/jeopardy-board.json').then(r=>r.json()).then(j=>{const el=$('board');j.categories.forEach(c=>{const h=document.createElement('div');h.className='cat';h.textContent=c.name;el.appendChild(h)});for(let row=0;row<4;row++)j.categories.forEach(c=>{const cell=c.cells[row],b=document.createElement('button');b.className='cell';b.textContent=cell.points;b.onclick=()=>open(cell,b);el.appendChild(b)})});function open(cell,btn){if(!armed||dead.has(cell.id)||left<=0)return;const card=$('card');card.innerHTML='<h2>'+cell.title+'</h2><p>'+cell.prompt+'</p>';cell.choices.forEach((t,i)=>{const x=document.createElement('button');x.className='gq-c';x.textContent=t;x.onclick=()=>{const ok=i===cell.answer;beep(ok);if(ok){streak++;const bonus=streak>=3?Math.round(cell.points*.25):0;$('score').textContent=+($('score').textContent)+cell.points+bonus;$('streak').textContent=streak;x.className='gq-c yes';x.textContent='YES — '+cell.flag;dead.add(cell.id);btn.classList.add('dead');toast('+'+ (cell.points+bonus))}else{streak=0;$('streak').textContent=0;$('miss').textContent=+($('miss').textContent)+1;x.className='gq-c no';x.textContent=cell.teach;toast('MISS')}};card.appendChild(x)});const z=document.createElement('button');z.className='gq-c';z.textContent='Close';z.onclick=()=>$('modal').classList.remove('on');$('modal').classList.add('on');card.appendChild(z);$('modal').style.display='flex';$('modal').classList.add('on')}setInterval(()=>{if(!armed)return;if(left<=0){$('clock').textContent='STOP';$('clock').classList.add('low');return}left--;$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('fuel').style.transform='scaleX('+(left/TOTAL)+')';if(left<=600)$('clock').classList.add('low')},1000)</script></body></html>
