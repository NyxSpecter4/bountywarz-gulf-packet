<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Athelgard Range Cup</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
:root{--gold:#e2c36b;--cyan:#3ec7d6;--miss:#ff6b6b;--ink:#f3ead6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(1200px 600px at 50% -10%,#1a1630 0%,transparent 55%),linear-gradient(180deg,#0b0a12,#07060c 40%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.35) 3px 4px)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:18px 22px 8px;position:relative;z-index:2}
.brand{font-family:Cinzel,serif;font-size:22px;letter-spacing:.12em;color:var(--gold);margin:0}
.sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9aa;margin:4px 0 0}
.hud{display:flex;gap:18px;font-family:"JetBrains Mono",monospace;font-size:13px;align-items:center}
.hud b{color:var(--gold);font-size:18px}
#clock{color:var(--gold);font-size:28px;font-weight:700}
#clock.low{color:var(--miss);animation:pulse .7s infinite}
@keyframes pulse{50%{opacity:.45}}
.wrap{max-width:1180px;margin:0 auto;padding:8px 16px 40px;position:relative;z-index:2}
.lede{font-size:14px;color:#c9c3b4;max-width:720px;line-height:1.45}
.lede a{color:var(--cyan)}
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
.cat{text-align:center;font-family:Cinzel,serif;font-size:12px;letter-spacing:.1em;color:var(--gold);padding:10px 4px}
.cell{appearance:none;border:1px solid #3a2f16;background:linear-gradient(180deg,#1c1810,#12100c);color:var(--gold);border-radius:12px;padding:28px 8px;font:800 26px Inter,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s,filter .12s}
.cell:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 0 24px rgba(226,195,107,.25)}
.cell.dead{filter:grayscale(.7) brightness(.45);cursor:default;transform:none}
.cell.hit{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
#modal{display:none;position:fixed;inset:0;background:rgba(3,4,8,.72);z-index:20;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#card{width:min(560px,94vw);background:#10141c;border:1px solid var(--gold);border-radius:16px;padding:26px 22px 18px;box-shadow:0 0 80px rgba(226,195,107,.15)}
.k{font-size:11px;letter-spacing:.18em;color:var(--gold);margin:0 0 8px}
#card h2{font-family:Cinzel,serif;margin:0 0 10px;font-size:22px}
#card p{line-height:1.5;margin:0 0 16px}
.gq-c{display:block;width:100%;margin:0 0 8px;text-align:left;background:#1a212c;border:1px solid #2e3848;color:var(--ink);padding:12px 14px;border-radius:10px;cursor:pointer;font:14px Inter,sans-serif}
.gq-c:hover{border-color:var(--cyan)}
.gq-c.yes{border-color:var(--gold);background:#2a2414;color:var(--gold);font-weight:700}
.gq-c.no{border-color:var(--miss);color:#ffd0d0}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);background:#e2c36b;color:#1a1408;padding:10px 18px;border-radius:999px;font-weight:800;letter-spacing:.08em;opacity:0;pointer-events:none;z-index:40;transition:.25s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.bar{height:4px;background:#1a1a22;margin:10px 22px 0;border-radius:99px;overflow:hidden}
#fuel{height:100%;width:100%;background:linear-gradient(90deg,#e2c36b,#3ec7d6);transform-origin:left}
footer{padding:8px 22px 24px;font-size:12px;color:#777}
</style></head>
<body>
<div id="toast"></div>
<header><div><p class="brand">ATHELGARD RANGE CUP</p><p class="sub">Classify the twin · keep the card · stop at 90</p></div>
<div class="hud"><span>SCORE <b id="score">0</b></span><span>STREAK <b id="streak">0</b></span><span>MISS <b id="miss">0</b></span><span id="clock">90:00</span></div></header>
<div class="bar"><div id="fuel"></div></div>
<div class="wrap"><p class="lede">Not HTB. Not a dogfight. Hit pops. Miss teaches.
<a href="https://bountywarz.com/worlds/drone-london-recon/">Fly London</a> if you want the city.</p>
<div id="board"></div></div>
<div id="modal"><div id="card"></div></div>
<footer>Twins only. Sim evidence. Not a certificate.</footer>
<script>
const $=id=>document.getElementById(id);
let left=90*60,dead=new Set(),streak=0; const TOTAL=90*60;
function beep(ok){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ctx=new A();const o=ctx.createOscillator();const g=ctx.createGain();o.type='square';o.frequency.value=ok?880:180;g.gain.value=0.04;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.18);o.stop(ctx.currentTime+0.2);}catch(e){}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1600);}
fetch('data/jeopardy-board.json').then(r=>r.json()).then(j=>{const el=$('board');j.categories.forEach(c=>{const h=document.createElement('div');h.className='cat';h.textContent=c.name;el.appendChild(h);});for(let row=0;row<4;row++)j.categories.forEach(c=>{const cell=c.cells[row];const b=document.createElement('button');b.className='cell';b.textContent=cell.points;b.onclick=()=>openCell(cell,b);el.appendChild(b);});});
function openCell(cell,btn){if(dead.has(cell.id)||left<=0)return;const card=$('card');
card.innerHTML='<div class="k">'+cell.points+' · '+cell.id.split('-')[0].toUpperCase()+'</div><h2>'+cell.title+'</h2><p>'+cell.prompt+'</p>';
cell.choices.forEach((t,i)=>{const x=document.createElement('button');x.className='gq-c';x.textContent=t;
x.onclick=()=>{const ok=i===cell.answer;beep(ok);if(ok){streak++;const bonus=streak>=3?Math.round(cell.points*0.25):0;$('score').textContent=String(Number($('score').textContent)+cell.points+bonus);$('streak').textContent=String(streak);x.className='gq-c yes';x.textContent=(bonus?('STREAK +'+bonus+' · '):'YES — ')+cell.flag;dead.add(cell.id);btn.classList.add('dead','hit');toast(bonus?('STREAK x'+streak+' · +'+(cell.points+bonus)):('+'+cell.points+' · '+cell.title));}else{streak=0;$('streak').textContent='0';$('miss').textContent=String(Number($('miss').textContent)+1);x.className='gq-c no';x.textContent=cell.teach;toast('MISS — the class still stands');}};card.appendChild(x);});
const c=document.createElement('button');c.className='gq-c';c.textContent='Close';c.onclick=()=>$('modal').classList.remove('on');card.appendChild(c);$('modal').classList.add('on');}
setInterval(()=>{if(left<=0){$('clock').textContent='STOP';$('clock').classList.add('low');return;}left--;$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('fuel').style.transform='scaleX('+(left/TOTAL)+')';if(left<=600)$('clock').classList.add('low');},1000);
</script></body></html>
